<script>
// Deteksi error global sebelum React/Babel load
window.__appErrors = [];
window.onerror = function(msg, src, line, col, err) {
  window.__appErrors.push(msg);
  var ed = document.getElementById('error-display');
  var em = document.getElementById('error-msg');
  var ld = document.getElementById('app-loading');
  if(ed && em) {
    em.textContent = msg + (src ? ' | ' + src.split('/').pop() + ':' + line : '');
    ed.style.display = 'flex';
    if(ld) ld.style.display = 'none';
  }
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  if(window.onerror) window.onerror(String(e.reason));
});
// Cek library load setelah semua script
window.addEventListener('load', function() {
  var missing = [];
  if(typeof React === 'undefined') missing.push('React');
  if(typeof ReactDOM === 'undefined') missing.push('ReactDOM');
  if(typeof Babel === 'undefined') missing.push('Babel');
  if(missing.length > 0) {
    var ed = document.getElementById('error-display');
    var em = document.getElementById('error-msg');
    var ld = document.getElementById('app-loading');
    if(em) em.textContent = 'Library tidak dapat dimuat: ' + missing.join(', ') + '. Periksa koneksi internet Anda.';
    if(ed) ed.style.display = 'flex';
    if(ld) ld.style.display = 'none';
  }
});
</script>
<script type="text/babel">
const {useState,useRef,useCallback} = React;

/* ═══ ERROR BOUNDARY ═══ */
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:''};}
  static getDerivedStateFromError(err){return{hasError:true,error:err?.message||String(err)};}
  componentDidCatch(err,info){console.error('React Error:',err,info);}
  render(){
    if(this.state.hasError){
      return React.createElement('div',{style:{minHeight:'100vh',background:'#0D1117',display:'flex',alignItems:'center',justifyContent:'center',padding:24,fontFamily:'Sora,sans-serif'}},
        React.createElement('div',{style:{background:'#2D0C0C',border:'1px solid #F85149',borderRadius:12,padding:24,maxWidth:600,width:'100%',color:'#F85149'}},
          React.createElement('h2',{style:{fontSize:16,fontWeight:700,marginBottom:12}},'⚠️ Terjadi Kesalahan Aplikasi'),
          React.createElement('p',{style:{fontSize:13,color:'#FCA5A5',lineHeight:1.6}},this.state.error),
          React.createElement('button',{onClick:()=>location.reload(),style:{marginTop:16,background:'#F97316',border:'none',color:'#fff',padding:'10px 24px',borderRadius:8,fontSize:14,cursor:'pointer'}},'🔄 Muat Ulang')
        )
      );
    }
    return this.props.children;
  }
}

/* ═══ EXCEL EXPORT ═══ */
const exportXlsx=(rows,headers,filename)=>{
  try{
    const XLSX=window.XLSX;
    if(!XLSX){alert('Library Excel belum dimuat, coba refresh halaman.');return;}
    // Konversi nilai ke tipe yang tepat: angka tetap angka, persen tetap string
    const cleanRows=rows.map(row=>row.map(val=>{
      if(val===null||val===undefined)return '';
      if(typeof val==='number')return val;
      if(typeof val==='string'){
        // Bersihkan format Rp menjadi angka murni untuk Excel
        const rpClean=val.replace(/^Rp\s*/,'').replace(/\./g,'').replace(/,/g,'.');
        const num=parseFloat(rpClean);
        // Hanya konversi jika berupa angka murni (bukan %, teks, dll)
        if(!isNaN(num)&&val.startsWith('Rp ')&&!val.includes('%'))return num;
        return val;
      }
      return val;
    }));
    const wsData=[headers,...cleanRows];
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    // Set lebar kolom berdasarkan konten
    const colWidths=headers.map((h,ci)=>{
      const hLow=(h||'').toLowerCase();
      let minW=10;
      if(hLow==='no'||hLow==='no.'||hLow==='qty')minW=5;
      else if(hLow.includes('nama')||hLow.includes('barang')||hLow.includes('pembeli'))minW=28;
      else if(hLow.includes('kelengkapan'))minW=20;
      else if(hLow.includes('resi'))minW=20;
      else if(hLow.includes('tanggal')||hLow.includes('tgl'))minW=14;
      else if(hLow.includes('total')||hLow.includes('harga')||hLow.includes('margin')||hLow.includes('profit')||hLow.includes('bersih')||hLow.includes('reseller'))minW=18;
      const maxLen=Math.max(h.length,...cleanRows.map(r=>{const v=r[ci];return v!==null&&v!==undefined?String(v).length:0;}));
      return{wch:Math.max(minW,Math.min(maxLen+2,45))};
    });
    ws['!cols']=colWidths;
    // Format header row
    const range=XLSX.utils.decode_range(ws['!ref']||'A1');
    for(let ci=range.s.c;ci<=range.e.c;ci++){
      const addr=XLSX.utils.encode_cell({r:0,c:ci});
      if(!ws[addr])continue;
      ws[addr].s={font:{bold:true,color:{rgb:'F97316'}},fill:{fgColor:{rgb:'161B22'}},alignment:{horizontal:'center',wrapText:false}};
    }
    // Format sel angka (baris data)
    for(let ri=1;ri<=cleanRows.length;ri++){
      for(let ci=0;ci<=headers.length-1;ci++){
        const addr=XLSX.utils.encode_cell({r:ri,c:ci});
        if(!ws[addr])continue;
        if(typeof ws[addr].v==='number'){
          ws[addr].s={numFmt:'#,##0',alignment:{horizontal:'right'}};
        }
      }
    }
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Data');
    // Sheet ringkasan tidak diperlukan jika sudah di PDF
    const ts=new Date().toLocaleDateString('id-ID').replace(/\//g,'-');
    XLSX.writeFile(wb,`${filename}_${ts}.xlsx`);
  }catch(e){alert('Gagal export Excel: '+e.message);}
};

/* ═══ PDF EXPORT ═══ */
const exportPdf=(rows,headers,title,filename,summary)=>{
  try{
    const {jsPDF}=window.jspdf;
    if(!jsPDF){alert('Library PDF belum dimuat, coba refresh halaman.');return;}
    // Tentukan format kertas berdasarkan jumlah kolom
    const colCount=headers.length;
    const isVeryWide=colCount>20;
    const isWide=colCount>12;
    const fmt=isVeryWide?'a3':isWide?'a3':'a4';
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:fmt});
    const pageW=doc.internal.pageSize.getWidth();
    const pageH=doc.internal.pageSize.getHeight();
    const marginL=8;const marginR=8;
    const ts=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
    // Header background
    doc.setFillColor(13,17,23);
    doc.rect(0,0,pageW,28,'F');
    doc.setTextColor(249,115,22);
    doc.setFontSize(16);doc.setFont('helvetica','bold');
    doc.text('RANCO AUTO',marginL+6,12);
    doc.setTextColor(230,237,243);
    doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text(title,marginL+6,21);
    doc.setTextColor(139,148,158);
    doc.setFontSize(8);
    doc.text(`Dicetak: ${ts}`,pageW-marginR,21,{align:'right'});
    // Summary stats row
    let startY=34;
    if(summary&&summary.length>0){
      const boxW=(pageW-(marginL+marginR+4))/summary.length;
      summary.forEach((s,i)=>{
        const x=marginL+2+(i*boxW);
        doc.setFillColor(22,27,34);
        doc.roundedRect(x,29,boxW-2,14,1,1,'F');
        doc.setFontSize(7);doc.setTextColor(139,148,158);doc.setFont('helvetica','normal');
        doc.text(s.label,x+3,34.5);
        doc.setTextColor(249,115,22);doc.setFont('helvetica','bold');
        doc.setFontSize(8);
        doc.text(String(s.value),x+3,41);
        doc.setFont('helvetica','normal');
      });
      startY=50;
    }
    // Hitung lebar kolom otomatis
    const usableW=pageW-marginL-marginR;
    // Klasifikasikan tipe kolom untuk set lebar minimum
    const colStyles={};
    headers.forEach((h,i)=>{
      const hLow=h.toLowerCase();
      if(hLow==='no'||hLow==='qty'||hLow==='no.'||hLow==='no '){
        colStyles[i]={cellWidth:8,halign:'center'};
      }else if(hLow.includes('%')||hLow.includes('pct')){
        colStyles[i]={cellWidth:14,halign:'right'};
      }else if(hLow.includes('tgl')||hLow.includes('tanggal')){
        colStyles[i]={cellWidth:18,halign:'center'};
      }else if(hLow.includes('status')){
        colStyles[i]={cellWidth:16,halign:'center'};
      }else if(hLow.includes('total')||hLow.includes('margin')||hLow.includes('profit')||hLow.includes('harga')||hLow.includes('bersih')||hLow.includes('yield')||hLow.includes('operasional')||hLow.includes('ongkir')||hLow.includes('plastik')||hLow.includes('bulat')||hLow.includes('adm')||hLow.includes('reseller')){
        colStyles[i]={cellWidth:20,halign:'right'};
      }else if(hLow.includes('nama')||hLow.includes('pembeli')||hLow.includes('barang')){
        colStyles[i]={cellWidth:28};
      }else if(hLow.includes('host')||hLow.includes('tempat')||hLow.includes('platform')||hLow.includes('kelengkapan')){
        colStyles[i]={cellWidth:20};
      }else if(hLow.includes('kode')){
        colStyles[i]={cellWidth:14,halign:'center'};
      }else if(hLow.includes('resi')){
        colStyles[i]={cellWidth:20};
      }
    });
    const fSize=isVeryWide?5.5:isWide?6:7;
    const cellPad=isVeryWide?1:1.5;
    // Table
    doc.autoTable({
      head:[headers],
      body:rows,
      startY,
      theme:'grid',
      styles:{fontSize:fSize,cellPadding:cellPad,textColor:[230,237,243],lineColor:[33,38,45],lineWidth:0.15,overflow:'linebreak'},
      headStyles:{fillColor:[22,27,34],textColor:[200,210,220],fontStyle:'bold',fontSize:fSize,halign:'center',valign:'middle'},
      alternateRowStyles:{fillColor:[16,20,26]},
      bodyStyles:{fillColor:[22,27,34],valign:'middle'},
      columnStyles:colStyles,
      margin:{left:marginL,right:marginR},
      tableWidth:'auto',
      didDrawPage:(data)=>{
        // Header ulang tiap halaman
        doc.setFillColor(13,17,23);
        doc.rect(0,0,pageW,7,'F');
        doc.setFontSize(6);doc.setTextColor(249,115,22);doc.setFont('helvetica','bold');
        doc.text('RANCO AUTO',marginL+2,5);
        doc.setTextColor(139,148,158);doc.setFont('helvetica','normal');
        doc.text(`${title} — ${ts}`,marginL+30,5);
        // Footer
        const pCount=doc.internal.getNumberOfPages();
        const pNum=doc.internal.getCurrentPageInfo().pageNumber;
        doc.setFontSize(6.5);doc.setTextColor(139,148,158);
        doc.text(`Halaman ${pNum} dari ${pCount}`,pageW/2,pageH-4,{align:'center'});
        doc.text('Ranco Auto — Sistem Manajemen',marginL,pageH-4);
        doc.text(ts,pageW-marginR,pageH-4,{align:'right'});
      }
    });
    const tsFn=new Date().toLocaleDateString('id-ID').replace(/\//g,'-');
    doc.save(`${filename}_${tsFn}.pdf`);
  }catch(e){alert('Gagal export PDF: '+e.message);}
};

/* ═══ PAGINATION ═══ */
const PAGE_SIZE=10;
const usePaginate=(data)=>{
  const[pg,setPg]=useState(1);
  const total=Math.ceil(data.length/PAGE_SIZE)||1;
  const safePg=Math.min(pg,total);
  const slice=data.slice((safePg-1)*PAGE_SIZE,safePg*PAGE_SIZE);
  return{slice,pg:safePg,total,setPg};
};
const Pagination=({pg,total,setPg,count,filtered})=>{
  if(total<=1)return null;
  const from=(pg-1)*PAGE_SIZE+1;const to=Math.min(pg*PAGE_SIZE,count);
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 4px',flexWrap:'wrap',gap:8}}>
      <span style={{color:'#8B949E',fontSize:12}}>{from}–{to} dari {count} data</span>
      <div style={{display:'flex',gap:4}}>
        <button onClick={()=>setPg(1)} disabled={pg===1} style={{background:'#161B22',border:'1px solid #21262D',color:pg===1?'#30363D':'#8B949E',padding:'4px 8px',borderRadius:5,cursor:pg===1?'default':'pointer',fontSize:12}}>«</button>
        <button onClick={()=>setPg(p=>Math.max(1,p-1))} disabled={pg===1} style={{background:'#161B22',border:'1px solid #21262D',color:pg===1?'#30363D':'#8B949E',padding:'4px 10px',borderRadius:5,cursor:pg===1?'default':'pointer',fontSize:12}}>‹</button>
        {Array.from({length:Math.min(5,total)},(_,i)=>{
          let p;if(total<=5)p=i+1;else if(pg<=3)p=i+1;else if(pg>=total-2)p=total-4+i;else p=pg-2+i;
          return<button key={p} onClick={()=>setPg(p)} style={{background:pg===p?'#F97316':'#161B22',border:`1px solid ${pg===p?'#F97316':'#21262D'}`,color:pg===p?'#fff':'#8B949E',padding:'4px 9px',borderRadius:5,cursor:'pointer',fontSize:12,fontWeight:pg===p?600:400,minWidth:30}}>{p}</button>;
        })}
        <button onClick={()=>setPg(p=>Math.min(total,p+1))} disabled={pg===total} style={{background:'#161B22',border:'1px solid #21262D',color:pg===total?'#30363D':'#8B949E',padding:'4px 10px',borderRadius:5,cursor:pg===total?'default':'pointer',fontSize:12}}>›</button>
        <button onClick={()=>setPg(total)} disabled={pg===total} style={{background:'#161B22',border:'1px solid #21262D',color:pg===total?'#30363D':'#8B949E',padding:'4px 8px',borderRadius:5,cursor:pg===total?'default':'pointer',fontSize:12}}>»</button>
      </div>
      <span style={{color:'#8B949E',fontSize:12}}>Hal {pg}/{total}</span>
    </div>
  );
};

const ImageUpload=({value,onChange})=>{
  const ref=useRef();
  const handle=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>2*1024*1024)return alert('Ukuran gambar maksimal 2MB!');
    const r=new FileReader();
    r.onloadend=()=>onChange(r.result);
    r.readAsDataURL(f);
  };
  return(
    <div>
      <input type="file" accept="image/*" ref={ref} onChange={handle} style={{display:'none'}}/>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <button type="button" onClick={()=>ref.current.click()} style={{background:'#21262D',border:'1px solid #30363D',color:'#E6EDF3',padding:'8px 14px',borderRadius:6,cursor:'pointer',fontSize:13}}>
          📁 Pilih Gambar

      </div>
      {value&&<div style={{marginTop:10,position:'relative',display:'inline-block'}}>
        <img src={value} alt="preview" style={{width:100,height:100,objectFit:'cover',borderRadius:8,border:'1px solid #30363D'}}/>
      </div>}
      {!value&&<div style={{marginTop:8,background:'#0D1117',border:'1px dashed #30363D',borderRadius:6,padding:'20px',textAlign:'center',color:'#8B949E',fontSize:12}}>
        Belum ada gambar · Maks 2MB
      </div>}
    </div>
  );
};

  const calcReseller=(kodeBarang,kodeBosk,kelengkapan,jumlah,kodeStir2,kodeBosk2)=>{
    const kel=String(kelengkapan||'1');
    const stir=stokMap[kodeBarang];
    const stir2=(kel==='6'||kel==='7')&&kodeStir2?stokMap[kodeStir2]:null;
    const bosk=(kel==='2'||kel==='7'||kel==='8')&&kodeBosk?stokMap[kodeBosk]:null;
    const bosk2=kel==='8'&&kodeBosk2?stokMap[kodeBosk2]:null;
    const hr=(stir?stir.hargaReseller||0:0)
            +(stir2?stir2.hargaReseller||0:0)
            +(bosk?bosk.hargaReseller||0:0)
            +(bosk2?bosk2.hargaReseller||0:0);
    return hr*(jumlah||1);
  };
  const combined=[
    ...db.orderLive.filter(o=>!o.hostNama?.startsWith('ADMIN')&&!o.penjualanId).map(o=>({
      _src:'hostlive',id:o.id,no:0,hostNama:o.hostNama||'-',pembeli:o.pembeli,

    const nAdm=Math.round(tj*((pot.adm||0)/100));
    const nOngkirFree=Math.round(tj*((pot.ongkirFree||0)/100));

    const biayaLayanan=+(pot.biayaLayanan||0);
    const biayaLogistik=+(pot.biayaLogistik||0);
    const pajak=Math.round(tj*((pot.pajak||0)/100));
    const totalPotonganAplikasi=r.totalPotonganAplikasiOverride!=null?r.totalPotonganAplikasiOverride:(nAdm+bulat+biayaLayanan+biayaLogistik);
    const profitBisnis=totalReseller-tm;
    const persentaseProfitKotor=tj>0?(profitBisnis/tj*100):0;
    const totalPengeluaran=ongkirCargo+nYield+plastikLakbanDus+nOperasional;
    const marginBisnis=profitBisnis-totalPengeluaran;
    const persentaseMarginBisnis=tj>0?(marginBisnis/tj*100):0;
    const marginLive=tj-totalReseller;
    const persentaseMarginLive=tj>0?(marginLive/tj*100):0;
    const bersihPotonganAdm=tj-totalReseller-totalPotonganAplikasi-pajak;
    return{...r,no:i+1,
      totalReseller,ongkirCargo,nYield,plastikLakbanDus,nOperasional,nAdm,nOngkirFree,bulat,
      biayaLayanan,biayaLogistik,pajak,totalPotonganAplikasi,
      profitBisnis,persentaseProfitKotor,totalPengeluaran,marginBisnis,persentaseMarginBisnis,
      marginLive,persentaseMarginLive,bersihPotonganAdm,
      admPct:pot.adm,foPct:pot.ongkirFree,yieldPct:pot.yield,operasionalPct:pot.operasional,

/* KELOLA REFUND */
const KelolaRefund=({db,update})=>{
  const[modal,setModal]=useState(null);const[form,setForm]=useState({});
  const[search,setSearch]=useState('');
  const refunds=db.orderLive.filter(o=>o.status==='REFUND');
  const pending=refunds.filter(o=>!o.refundDiterima).filter(o=>!search||o.pembeli?.toLowerCase().includes(search.toLowerCase())||o.nomorResi?.toLowerCase().includes(search.toLowerCase())||o.kodeBarang?.toLowerCase().includes(search.toLowerCase()));
  const diterima=refunds.filter(o=>o.refundDiterima).filter(o=>!search||o.pembeli?.toLowerCase().includes(search.toLowerCase())||o.nomorResi?.toLowerCase().includes(search.toLowerCase()));
  const {slice:sliceP,pg:pgP,total:totP,setPg:setPgP}=usePaginate(pending);
  const {slice:sliceD,pg:pgD,total:totD,setPg:setPgD}=usePaginate(diterima);

  const terimaRefund=order=>{
    if(!confirm(`Terima refund dari ${order.pembeli}?\nStok ${order.kodeBarang} akan bertambah 1 unit.`))return;
    const newStok=db.stok.map(s=>s.kode===order.kodeBarang?{...s,masuk:s.masuk+1,stokAkhir:s.stokAkhir+1}:s);
    const newOrders=db.orderLive.map(o=>o.id===order.id?{...o,refundDiterima:true,tglRefundDiterima:todayStr()}:o);
    const newLog=[...db.refundLog,{id:uid(),tanggal:todayStr(),orderId:order.id,nomorResi:order.nomorResi||'-',kodeBarang:order.kodeBarang,namaBarang:order.namaBarang,pembeli:order.pembeli,hostNama:order.hostNama,platform:order.platform,hargaJual:order.hargaJual}];
    update('stok',newStok);update('orderLive',newOrders);update('refundLog',newLog);
    alert(`✅ Refund diterima! Stok ${order.kodeBarang} +1`);
  };

  const initForm=()=>({tanggal:todayStr(),pembeli:'',nomorHp:'',nomorResi:'',kodeBarang:'',namaBarang:'',platform:'',hargaJual:0,hostNama:'ADMIN'});

  const saveManual=()=>{
    if(!form.pembeli||!form.kodeBarang)return alert('Lengkapi data!');
    // Tambah stok barang
    const newStok=db.stok.map(s=>s.kode===form.kodeBarang?{...s,masuk:s.masuk+1,stokAkhir:s.stokAkhir+1}:s);
    // Langsung masuk refundLog (sudah diterima)
    const newLog=[...db.refundLog,{
      id:uid(),tanggal:form.tanggal,orderId:'manual-'+uid(),
      nomorResi:form.nomorResi||'-',kodeBarang:form.kodeBarang,
      namaBarang:form.namaBarang,pembeli:form.pembeli,
      hostNama:form.hostNama||'ADMIN',platform:form.platform,hargaJual:+form.hargaJual
    }];
    update('stok',newStok);update('refundLog',newLog);
    setModal(null);
    alert(`✅ Refund manual ditambahkan! Stok ${form.kodeBarang} +1`);
  };

  return(
    <div>
      <PageHeader title="Kelola Refund" sub={`${pending.length} menunggu · ${diterima.length} sudah diterima`}
        action={<Btn onClick={()=>{setForm(initForm());setModal('add');}}>+ Tambah Refund Manual</Btn>}/>
      <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <StatCard icon="⏳" label="Menunggu Diterima" value={refunds.filter(o=>!o.refundDiterima).length} color={refunds.filter(o=>!o.refundDiterima).length>0?'#F85149':'#8B949E'}/>
        <StatCard icon="✅" label="Sudah Diterima" value={refunds.filter(o=>o.refundDiterima).length} color="#3FB950"/>
        <StatCard icon="📦" label="Total Refund" value={refunds.length} color="#F97316"/>
      </div>
      <div style={{marginBottom:14}}><SearchBar value={search} onChange={setSearch} placeholder="Cari pembeli, nomor resi, atau kode barang..."/></div>
      <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#E3B341'}}>⏳ Menunggu Penerimaan ({pending.length})</h3>
      <TblWrap><table>
        <thead><tr><th>No</th><th>Tgl Order</th><th>Host</th><th>Pembeli</th><th>No HP</th><th>Nomor Resi</th><th>Kode</th><th>Nama Barang</th><th>Platform</th><th>Harga Jual</th><th>Aksi</th></tr></thead>
        <tbody>
          {sliceP.length===0&&<tr><td colSpan={11} style={{textAlign:'center',color:'#8B949E',padding:20}}>✅ Tidak ada refund yang menunggu.</td></tr>}
          {sliceP.map((o,i)=>(
            <tr key={o.id}>
              <td style={{color:'#8B949E'}}>{(pgP-1)*PAGE_SIZE+i+1}</td><td style={{color:'#8B949E'}}>{fmtDate(o.tanggal)}</td>
              <td><span style={{background:'#1A2F50',color:'#58A6FF',padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:600}}>{o.hostNama}</span></td>
              <td style={{fontWeight:500,color:'#F85149'}}>{o.pembeli}</td><td style={{color:'#8B949E'}}>{o.nomorHp}</td>
              <td style={{color:'#58A6FF',fontWeight:500}}>{o.nomorResi||'-'}</td>
              <td style={{color:'#F97316',fontWeight:600}}>{o.kodeBarang}</td>
              <td className="col-nama">{o.namaBarang}</td>
              <td style={{color:'#8B949E'}}>{o.platform}</td><td>{fmtRp(o.hargaJual)}</td>
              <td><Btn size="xs" variant="success" onClick={()=>terimaRefund(o)}>✅ Terima</Btn></td>
            </tr>
          ))}
        </tbody>
      </table></TblWrap>
      <Pagination pg={pgP} total={totP} setPg={setPgP} count={pending.length}/>
      {diterima.length>0&&<>
        <h3 style={{fontSize:13,fontWeight:600,margin:'20px 0 10px',color:'#3FB950'}}>✅ Sudah Diterima ({diterima.length})</h3>
        <TblWrap><table>
          <thead><tr><th>No</th><th>Tgl Order</th><th>Tgl Diterima</th><th>Host</th><th>Pembeli</th><th>Nomor Resi</th><th>Kode</th><th>Nama Barang</th><th>Harga Jual</th></tr></thead>
          <tbody>
            {sliceD.map((o,i)=>(
              <tr key={o.id}>
                <td style={{color:'#8B949E'}}>{(pgD-1)*PAGE_SIZE+i+1}</td><td style={{color:'#8B949E'}}>{fmtDate(o.tanggal)}</td>
                <td style={{color:'#3FB950'}}>{fmtDate(o.tglRefundDiterima)}</td>
                <td><span style={{background:'#1A2F50',color:'#58A6FF',padding:'2px 8px',borderRadius:20,fontSize:11}}>{o.hostNama}</span></td>
                <td style={{fontWeight:500}}>{o.pembeli}</td>
                <td style={{color:'#58A6FF',fontWeight:500}}>{o.nomorResi||'-'}</td>
                <td style={{color:'#F97316'}}>{o.kodeBarang}</td>
                <td>{o.namaBarang}</td><td>{fmtRp(o.hargaJual)}</td>
              </tr>
            ))}
          </tbody>
        </table></TblWrap>
        <Pagination pg={pgD} total={totD} setPg={setPgD} count={diterima.length}/>
      </>}
      {modal==='add'&&<Modal title="Tambah Refund Manual" onClose={()=>setModal(null)} width={620}>
        <div style={{background:'#1A2030',borderRadius:7,padding:'9px 14px',marginBottom:14,fontSize:12,color:'#58A6FF'}}>
          📌 Untuk refund barang yang tidak melalui order host live. Stok barang otomatis bertambah.
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <FRow label="Tanggal"><Inp value={form.tanggal} onChange={v=>setForm({...form,tanggal:v})} type="date"/></FRow>
          <FRow label="Nomor Resi"><Inp autoFocus value={form.nomorResi} onChange={v=>setForm({...form,nomorResi:v})} placeholder="Nomor resi (opsional)"/></FRow>
          <FRow label="Nama Pembeli"><Inp value={form.pembeli} onChange={v=>setForm({...form,pembeli:v})} placeholder="Nama pembeli"/></FRow>
          <FRow label="Nomor HP"><Inp value={form.nomorHp} onChange={v=>setForm({...form,nomorHp:v})} placeholder="08xxx"/></FRow>
          <FRow label="Kode Barang">
            <Sel value={form.kodeBarang} onChange={v=>{const b=db.stok.find(s=>s.kode===v);setForm(f=>({...f,kodeBarang:v,namaBarang:b?.nama||''}));}} placeholder="-- Pilih Barang --"
              options={db.stok.map(s=>({value:s.kode,label:`${s.kode} — ${s.nama}`}))}/>
          </FRow>
          <FRow label="Platform"><Sel value={form.platform} onChange={v=>setForm({...form,platform:v})} placeholder="-- Platform --" options={[...db.potongan.map(p=>({value:p.platform,label:p.platform})),{value:'Offline',label:'Offline/Langsung'}]}/></FRow>
          <FRow label="Harga Jual"><Inp value={form.hargaJual} onChange={v=>setForm({...form,hargaJual:+v})} type="number"/></FRow>
          <FRow label="Host / Sumber"><Inp value={form.hostNama} onChange={v=>setForm({...form,hostNama:v})} placeholder="Nama host atau sumber"/></FRow>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}>

  );

/* ADMIN: KELOLA ORDER PACKING */
const AdminPackMasuk=({db,update})=>{
  const[search,setSearch]=useState('');const[fStatus,setFStatus]=useState('');
  const[fDate,setFDate]=useState('');const[fPacking,setFPacking]=useState('');
  const[modal,setModal]=useState(null);const[form,setForm]=useState({});
  const packUsers=[...new Set(db.packKeluar.map(d=>d.packingNama))].filter(Boolean);
  const orders=db.orderLive.filter(o=>o.status!=='REFUND');
  const filtered=orders.filter(o=>{
    const m=!search||o.pembeli?.toLowerCase().includes(search.toLowerCase())||o.kodeBarang?.toLowerCase().includes(search.toLowerCase())||o.nomorResi?.toLowerCase().includes(search.toLowerCase());
    const s=!fStatus||o.status===fStatus;const d=!fDate||o.tanggal===fDate;
    return m&&s&&d;
  });
  const filteredKeluar=db.packKeluar.filter(d=>{
    const m=!search||d.namaBarang?.toLowerCase().includes(search.toLowerCase())||d.kodeBarang?.toLowerCase().includes(search.toLowerCase());
    const d2=!fDate||d.tanggal===fDate;const p=!fPacking||d.packingNama===fPacking;
    return m&&d2&&p;
  });
  const {slice:sliceMasuk,pg:pgMasuk,total:totMasuk,setPg:setPgMasuk}=usePaginate(filtered);
  const {slice:sliceKeluar,pg:pgKeluar,total:totKeluar,setPg:setPgKeluar}=usePaginate(filteredKeluar);
  React.useEffect(()=>{setPgMasuk(1);setPgKeluar(1);},[search,fDate,fStatus,fPacking]);
  const changeStatus=(id,status)=>update('orderLive',db.orderLive.map(o=>o.id===id?{...o,status}:o));
  const save=()=>{update('orderLive',db.orderLive.map(o=>o.id===form.id?{...form}:o));setModal(null);};
  const del=id=>{if(!confirm('Hapus order ini?'))return;update('orderLive',db.orderLive.filter(o=>o.id!==id));};
  const delKeluar=id=>{if(!confirm('Hapus data keluar?'))return;update('packKeluar',db.packKeluar.filter(d=>d.id!==id));};
  const boskitList=db.stok.filter(s=>s.jenis==='BOSKIT');
  const doExport=()=>{
    const XLSX=window.XLSX;
    if(!XLSX)return alert('Library Excel belum dimuat.');
    try{
      const wb=XLSX.utils.book_new();
      const hMasuk=['No','Tgl','Host','Pembeli','No HP','Kode','Nama Barang','Kelengkapan','Resi','Status'];
      const rMasuk=filtered.map((o,i)=>[i+1,fmtDate(o.tanggal),o.hostNama,o.pembeli,o.nomorHp,o.kodeBarang,o.namaBarang,kelLabel(o.kelengkapan),o.nomorResi||'-',o.status]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hMasuk,...rMasuk]),'Order Masuk');
      const hKeluar=['No','Tgl Kirim','Host','Pembeli','Platform','Kode','Nama Barang','Resi','Packing'];
      const rKeluar=filteredKeluar.map((d,i)=>[i+1,fmtDate(d.tanggal),d.hostNama,d.pembeli,d.platform,d.kodeBarang,d.namaBarang,d.nomorResi,d.packingNama||'-']);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hKeluar,...rKeluar]),'Tabel Keluar');
      const ts=new Date().toLocaleDateString('id-ID').replace(/\//g,'-');
      XLSX.writeFile(wb,`Kelola_Order_Packing_${ts}.xlsx`);
    }catch(e){alert('Gagal: '+e.message);}
  };

  return(
    <div>
      <PageHeader title="Kelola Order Packing" sub="Edit/hapus/ubah status order + lihat siapa yang packing"
        action={<><BtnExport onClick={doExport}/><BtnExportPdf onClick={()=>{
          const headers=['No','Tgl','Host','Pembeli','Kode','Nama Barang','Resi','Status'];
          const rows=filteredKeluar.map((d,i)=>[i+1,fmtDate(d.tanggal),d.hostNama,d.pembeli,d.kodeBarang,d.namaBarang,d.nomorResi||'-',d.status||'-']);
          const summary=[{label:'Order Aktif',value:filtered.length},{label:'Sudah Dikirim',value:filteredKeluar.length}];
          exportPdf(rows,headers,'KELOLA ORDER PACKING','Kelola_Order_Packing',summary);
        }}/></>}/>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{flex:1,minWidth:160}}><SearchBar value={search} onChange={setSearch} placeholder="Cari pembeli, kode, resi..."/></div>

const LaporanRefund=({db,update})=>{
  const[filterDate,setFilterDate]=useState('');const[search,setSearch]=useState('');

  const data=db.refundLog.filter(r=>
    (!filterDate||r.tanggal?.startsWith(filterDate))&&
    inDateRange(r.tanggal,dfrom,dto)&&
    (!search||r.pembeli?.toLowerCase().includes(search.toLowerCase())||
     r.nomorResi?.toLowerCase().includes(search.toLowerCase())||
     r.kodeBarang?.toLowerCase().includes(search.toLowerCase()))
  );
  const totalNilai=data.reduce((a,r)=>a+(r.hargaJual||0),0);
  const byBarang=data.reduce((acc,r)=>{acc[r.kodeBarang]=(acc[r.kodeBarang]||0)+1;return acc;},{});
  const {slice,pg,total,setPg}=usePaginate(data);
  React.useEffect(()=>setPg(1),[filterDate,search,dfrom,dto]);

  const delRefund=id=>{
    if(!confirm('Hapus data refund ini?\n(Stok TIDAK akan berubah)'))return;
    update('refundLog',db.refundLog.filter(r=>r.id!==id));
  };

  const doExport=()=>{
    const headers=['No','Tgl Diterima','Host','Pembeli','Nomor Resi','Kode Barang','Nama Barang','Platform','Harga Jual'];
    const rows=data.map((r,i)=>[i+1,fmtDate(r.tanggal),r.hostNama,r.pembeli,r.nomorResi||'-',r.kodeBarang,r.namaBarang,r.platform,r.hargaJual]);
    rows.push(['','','TOTAL','','','','','',totalNilai]);
    exportXlsx(rows,headers,'Laporan_Refund');

    const rows=data.map((r,i)=>[i+1,fmtDate(r.tanggal),r.hostNama,r.pembeli,r.kodeBarang,r.namaBarang,r.platform,fmtK(r.hargaJual)]);
    const summary=[{label:'Total Refund',value:data.length},{label:'Nilai Refund',value:fmtRp(totalNilai)},{label:'Jenis Barang',value:Object.keys(byBarang).length}];
    exportPdf(rows,headers,'LAPORAN REFUND','Laporan_Refund',summary);
  };

  return(
    <div>

        <StatCard icon="📦" label="Jenis Barang" value={Object.keys(byBarang).length} color="#8B949E"/>
      </div>

        <input type="month" value={filterDate} onChange={e=>setFilterDate(e.target.value)}
          style={{background:'#161B22',border:'1px solid #21262D',color:filterDate?'#E6EDF3':'#8B949E',padding:'7px 10px',borderRadius:6,fontSize:12,outline:'none'}}/>
        <DateRange from={dfrom} to={dto} onFrom={setDfrom} onTo={setDto} onReset={()=>{setDfrom('');setDto('');}}/>
        {(filterDate||dfrom||dto)&&<Btn size="xs" variant="ghost" onClick={()=>{setFilterDate('');setDfrom('');setDto('');}}>Reset</Btn>}
      </div>
      <TblWrap><table>
        <thead><tr><th>No</th><th>Tgl Diterima</th><th>Host</th><th>Pembeli</th><th>Nomor Resi</th><th>Kode</th><th>Nama Barang</th><th>Platform</th><th>Harga Jual</th><th>Hapus</th></tr></thead>

            <tr key={r.id}>
              <td style={{color:'#8B949E'}}>{(pg-1)*PAGE_SIZE+i+1}</td><td style={{color:'#8B949E'}}>{fmtDate(r.tanggal)}</td>
              <td><span style={{background:'#1A2F50',color:'#58A6FF',padding:'2px 8px',borderRadius:20,fontSize:11}}>{r.hostNama}</span></td>

const LaporanPenjualan=({db})=>{
  const[filterDate,setFilterDate]=useState('');const[fHost,setFHost]=useState('');
  const[dfrom,setDfrom]=useState('');const[dto,setDto]=useState('');const[fStatus,setFStatus]=useState('');
  const potMap=Object.fromEntries(db.potongan.map(p=>[p.platform,p]));
  const stokMap=Object.fromEntries(db.stok.map(s=>[s.kode,s]));
  const calcReseller=(kodeBarang,kodeBosk,kelengkapan,jumlah,kodeStir2,kodeBosk2)=>{
    const kel=String(kelengkapan||'1');
    const stir=stokMap[kodeBarang];
    const stir2=(kel==='6'||kel==='7')&&kodeStir2?stokMap[kodeStir2]:null;
    const bosk=(kel==='2'||kel==='7'||kel==='8')&&kodeBosk?stokMap[kodeBosk]:null;
    const bosk2=kel==='8'&&kodeBosk2?stokMap[kodeBosk2]:null;
    const hr=(stir?stir.hargaReseller||0:0)
            +(stir2?stir2.hargaReseller||0:0)
            +(bosk?bosk.hargaReseller||0:0)
            +(bosk2?bosk2.hargaReseller||0:0);
    return hr*(jumlah||1);
  };
  // Sama persis dengan KelolaPenjualan: exclude penjualanId untuk cegah duplikat
  const allData=[
    ...db.orderLive.filter(o=>!o.hostNama?.startsWith('ADMIN')&&!o.penjualanId).map(o=>({
      _src:'hostlive',id:o.id,hostNama:o.hostNama||'-',pembeli:o.pembeli,tempat:o.platform,
      kodeBarang:o.kodeBarang,namaBarang:o.namaBarang,jumlahProduk:1,
      kelengkapan:o.kelengkapan||'1',kodeBosk:o.kodeBosk||'',
      kodeStir2:o.kodeStir2||'',kodeBosk2:o.kodeBosk2||'',
      tanggal:o.tanggal,status:o.status||'PENDING',
      hargaJual:o.hargaJual||0,totalJual:o.hargaJual||0,
      hargaModal:o.harga||0,totalModal:o.harga||0,
      profit:(o.hargaJual||0)-(o.harga||0),
      totalProfit:(o.hargaJual||0)-(o.harga||0),
      nomorResi:o.nomorResi||'-',
      totalPotonganAplikasiOverride:o.totalPotonganAplikasiOverride??null,
    })),
    ...db.penjualan.map(p=>({...p,_src:'admin',hostNama:p.hostNama||'ADMIN',
      kelengkapan:p.kelengkapan||'1',kodeBosk:p.kodeBosk||'',
      kodeStir2:p.kodeStir2||'',kodeBosk2:p.kodeBosk2||'',
      totalModal:p.totalModal||((p.hargaModal||0)*(p.jumlahProduk||1))||0,
      totalJual:p.totalJual||((p.hargaJual||0)*(p.jumlahProduk||1))||0,
      totalPotonganAplikasiOverride:p.totalPotonganAplikasiOverride??null,
    }))
  ];
  const hosts=[...new Set(allData.map(d=>d.hostNama))].filter(Boolean);
  const data=allData
    .filter(p=>(!filterDate||p.tanggal?.startsWith(filterDate))&&(!fHost||p.hostNama===fHost)&&inDateRange(p.tanggal,dfrom,dto)&&(!fStatus||p.status===fStatus))
    .sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''))
    .map((p,i)=>{
      const pot=potMap[p.tempat]||{adm:0,cb:0,ongkirFree:0,ongkirCargo:0,label:0,yield:0,plastikLakbanDus:0,operasional:0};
      const tj=p.totalJual||0;
      const tm=p.totalModal||0;
      const totalReseller=calcReseller(p.kodeBarang,p.kodeBosk,p.kelengkapan,p.jumlahProduk,p.kodeStir2,p.kodeBosk2);
      const ongkirCargo=pot.ongkirCargo||0;
      const nYield=Math.round(tj*((pot.yield||0)/100));
      const plastikLakbanDus=pot.plastikLakbanDus||0;
      const nOperasional=Math.round(tj*((pot.operasional||0)/100));
      const nAdm=Math.round(tj*((pot.adm||0)/100));
      const nOngkirFree=Math.round(tj*((pot.ongkirFree||0)/100));
      const bulat=Math.min(nOngkirFree,650000);
      const biayaLayanan=+(pot.biayaLayanan||0);
      const biayaLogistik=+(pot.biayaLogistik||0);
      const pajak=Math.round(tj*((pot.pajak||0)/100));
      const pajakPct=pot.pajak||0;
      const totalPotonganAplikasi=p.totalPotonganAplikasiOverride!=null?p.totalPotonganAplikasiOverride:(nAdm+bulat+biayaLayanan+biayaLogistik);
      const profitBisnis=totalReseller-tm;
      const persentaseProfitKotor=tj>0?(profitBisnis/tj*100):0;
      const totalPengeluaran=ongkirCargo+nYield+plastikLakbanDus+nOperasional;
      const marginBisnis=profitBisnis-totalPengeluaran;
      const persentaseMarginBisnis=tj>0?(marginBisnis/tj*100):0;
      const marginLive=tj-totalReseller;
      const persentaseMarginLive=tj>0?(marginLive/tj*100):0;
      const bersihPotonganAdm=tj-totalReseller-totalPotonganAplikasi-pajak;
      const nCB=Math.round(tj*((pot.cb||0)/100));
      return{...p,no:i+1,admPct:pot.adm,cbPct:pot.cb,foPct:pot.ongkirFree,nAdm,nCB,nFO:nOngkirFree,bulat,
        biayaLayanan,biayaLogistik,pajak,pajakPct,totalPotonganAplikasi,
        totalReseller,ongkirCargo,nYield,plastikLakbanDus,nOperasional,nOngkirFree,
        profitBisnis,persentaseProfitKotor,totalPengeluaran,marginBisnis,persentaseMarginBisnis,
        marginLive,persentaseMarginLive,bersihPotonganAdm,
        bersih:tj-nAdm-nCB-nOngkirFree};
    });
  const tot=data.reduce((a,r)=>({tj:a.tj+(r.totalJual||0),tp:a.tp+(r.profitBisnis||0),bml:a.bml+(r.bersihPotonganAdm||0),mb:a.mb+(r.marginBisnis||0)}),{tj:0,tp:0,bml:0,mb:0});
  const {slice,pg,total,setPg}=usePaginate(data);
  React.useEffect(()=>setPg(1),[filterDate,fHost,dfrom,dto,fStatus]);

  const doExport=()=>{
    const headers=['No','Host Live','Pembeli','Tempat/Platform','Kode','Nama Barang','Kelengkapan','Qty','Nomor Resi','Tanggal','Status','Total Jual','Total Modal','Total Reseller','Ongkir Cargo','Yield','Plastik/Dus','Operasional','ADM (%)','Ongkir Free (%)','Bulat Max 650Rb','Biaya Layanan (Rp)','Biaya Logistik (Rp)','Pajak (Rp)','Profit Kotor','% Profit Kotor','Total Pengeluaran','Margin Bisnis','% Margin Bisnis','Margin Live','% Margin Live','Bersih Margin Live','TOTAL POTONGAN APLIKASI'];
    const rows=data.map(r=>[

      r.nomorResi||'-',fmtDate(r.tanggal),r.status,r.totalJual,r.totalModal,r.totalReseller,
      r.ongkirCargo,r.nYield,r.plastikLakbanDus,r.nOperasional,
      r.nAdm,r.nOngkirFree,r.bulat,r.biayaLayanan,r.biayaLogistik,r.pajak,
      r.profitBisnis,(r.persentaseProfitKotor||0).toFixed(2)+'%',r.totalPengeluaran,r.marginBisnis,
      (r.persentaseMarginBisnis||0).toFixed(2)+'%',r.marginLive,(r.persentaseMarginLive||0).toFixed(2)+'%',
      r.bersihPotonganAdm,r.totalPotonganAplikasi
    ]);
    const label=filterDate?`_${filterDate}`:'';
    exportXlsx(rows,headers,`Laporan_Penjualan${label}`);
  };

  const doPdf=()=>{
    const headers=['No','Tgl','Host','Pembeli','Kode','Nama Barang','Qty','Status','Tot.Jual','Profit Kotor','% PK','Margin Bisnis','%MB','Bersih Margin Live','Tot.Pot.Aplikasi'];
    const rows=data.map(r=>[r.no,fmtDate(r.tanggal),r.hostNama,r.pembeli,r.kodeBarang,r.namaBarang,r.jumlahProduk,r.status,fmtK(r.totalJual),fmtK(r.profitBisnis||0),(r.persentaseProfitKotor||0).toFixed(1)+'%',fmtK(r.marginBisnis||0),(r.persentaseMarginBisnis||0).toFixed(1)+'%',fmtK(r.bersihPotonganAdm||0),fmtK(r.totalPotonganAplikasi||0)]);
    const summary=[{label:'Total Jual',value:fmtRp(tot.tj)},{label:'Total Profit (kotor)',value:fmtRp(tot.tp)},{label:'Total Penghasilan Live',value:fmtRp(tot.bml)},{label:'Penghasilan Bersih',value:fmtRp(tot.mb)},{label:'Jumlah Transaksi',value:data.length}];
    const label=filterDate?` — ${filterDate}`:'';

        <StatCard icon="✅" label="Penghasilan Bersih" value={fmtRp(tot.mb)} color="#3FB950"/>

      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14,flexWrap:'wrap'}}>

const InputOrderLive=({db,update,user})=>{
  const[search,setSearch]=useState('');const[modal,setModal]=useState(null);const[form,setForm]=useState({});
  const my=db.orderLive.filter(o=>o.hostNama===user.nama);
  const filtered=my.filter(o=>!search||o.pembeli?.toLowerCase().includes(search.toLowerCase())||o.kodeBarang?.toLowerCase().includes(search.toLowerCase()));
  const {slice,pg,total,setPg}=usePaginate(filtered);
  React.useEffect(()=>setPg(1),[search]);
  const potMap=Object.fromEntries(db.potongan.map(p=>[p.platform,p]));
  const init=()=>({nomorResi:'',tanggal:todayStr(),nomorHp:'',pembeli:'',kodeBarang:'',namaBarang:'',kelengkapan:'1',kodeBosk:'',kodeBosk2:'',kodeStir2:'',platform:'',harga:0,totalHarga:0,hargaJual:0,perkiraanAdmin:0,pajak:0,status:'PENDING'});
  const onKode=v=>{
    const b=db.stok.find(s=>s.kode===v);
    if(b){
      const kel=form.kelengkapan||'1';
      const stir2=(kel==='6'||kel==='7')&&form.kodeStir2?db.stok.find(s=>s.kode===form.kodeStir2):null;
      const bosk=(kel==='2'||kel==='7'||kel==='8')&&form.kodeBosk?db.stok.find(s=>s.kode===form.kodeBosk):null;
      const bosk2=kel==='8'&&form.kodeBosk2?db.stok.find(s=>s.kode===form.kodeBosk2):null;
      const hj=b.hargaJual+(stir2?stir2.hargaJual:0)+(bosk?bosk.hargaJual:0)+(bosk2?bosk2.hargaJual:0);
      const hm=b.hargaBeli+(stir2?stir2.hargaBeli:0)+(bosk?bosk.hargaBeli:0)+(bosk2?bosk2.hargaBeli:0);
      const pot=potMap[form.platform];
      setForm(f=>({...f,kodeBarang:v,namaBarang:b.nama,harga:hm,hargaJual:hj,totalHarga:hj,
        perkiraanAdmin:pot?Math.round(hj*(pot.adm/100)):0,pajak:Math.round(hj*0.005)}));
    }else setForm(f=>({...f,kodeBarang:v}));
  };
  const onKodeBosk=v=>{
    const kel=form.kelengkapan||'1';
    const stir=db.stok.find(s=>s.kode===form.kodeBarang);
    const stir2=(kel==='6'||kel==='7')&&form.kodeStir2?db.stok.find(s=>s.kode===form.kodeStir2):null;
    const bosk=v?db.stok.find(s=>s.kode===v):null;
    const bosk2=kel==='8'&&form.kodeBosk2?db.stok.find(s=>s.kode===form.kodeBosk2):null;
    const hj=(stir?stir.hargaJual:0)+(stir2?stir2.hargaJual:0)+(bosk?bosk.hargaJual:0)+(bosk2?bosk2.hargaJual:0);
    const hm=(stir?stir.hargaBeli:0)+(stir2?stir2.hargaBeli:0)+(bosk?bosk.hargaBeli:0)+(bosk2?bosk2.hargaBeli:0);
    const pot=potMap[form.platform];
    setForm(f=>({...f,kodeBosk:v,hargaJual:hj,harga:hm,totalHarga:hj,
      perkiraanAdmin:pot?Math.round(hj*(pot.adm/100)):0,pajak:Math.round(hj*0.005)}));
  };
  const onKelengkapan=v=>{
    const stir=db.stok.find(s=>s.kode===form.kodeBarang);
    const hj=stir?stir.hargaJual:form.hargaJual;

/* PACKING: TABEL MASUK — semua order dari host live, bisa ubah status */
const PackMasuk=({db,update,user})=>{
  const[search,setSearch]=useState('');const[filterStatus,setFilterStatus]=useState('');const[fPlatform,setFPlatform]=useState('');
  // Tampilkan order yang belum DIKIRIM/SELESAI/REFUND
  const orders=db.orderLive.filter(o=>o.status!=='SELESAI'&&o.status!=='REFUND');
  const platformList=[...new Set(orders.map(o=>o.platform).filter(Boolean))].sort();
  const filtered=orders.filter(o=>{
    const m=!search||o.pembeli?.toLowerCase().includes(search.toLowerCase())||o.kodeBarang?.toLowerCase().includes(search.toLowerCase())||o.nomorResi?.toLowerCase().includes(search.toLowerCase())||o.platform?.toLowerCase().includes(search.toLowerCase());
    const s=!filterStatus||o.status===filterStatus;
    const pl=!fPlatform||o.platform===fPlatform;
    return m&&s&&pl;
  });
  const {slice,pg,total,setPg}=usePaginate(filtered);
  React.useEffect(()=>setPg(1),[search,filterStatus,fPlatform]);

  const setProses=id=>{
    update('orderLive',db.orderLive.map(o=>o.id===id?{...o,status:'PROSES'}:o));
    // Sync status ke db.penjualan jika order ini terhubung (order dari admin)
    const ord=db.orderLive.find(o=>o.id===id);
    if(ord?.penjualanId){
      update('penjualan',db.penjualan.map(p=>p.id===ord.penjualanId?{...p,status:'PROSES'}:p));
    }
  };

  const setDikirim=order=>{
    if(!order.nomorResi)return alert('Nomor resi belum diisi oleh Host Live!\nMinta host untuk mengisi nomor resi terlebih dahulu.');
    const kel=String(order.kelengkapan||'1');
    const needBosk=kel==='2'||kel==='7'||kel==='8';
    const needStir2=kel==='6'||kel==='7';
    const needBosk2=kel==='8';
    if(needBosk&&!order.kodeBosk)return alert('Kelengkapan ini butuh Boskit tapi belum dipilih!\nMinta host atau admin untuk melengkapi data boskit.');
    if(needStir2&&!order.kodeStir2)return alert('Kelengkapan ini butuh Stir #2 tapi belum dipilih!\nMinta host atau admin untuk melengkapi data stir.');
    if(needBosk2&&!order.kodeBosk2)return alert('Kelengkapan ini butuh Boskit #2 tapi belum dipilih!\nMinta host atau admin untuk melengkapi data boskit.');

    let msgDetail=`\n• Stir [${order.kodeBarang}] -1`;
    if(needStir2&&order.kodeStir2)msgDetail+=`\n• Stir #2 [${order.kodeStir2}] -1`;
    if(needBosk&&order.kodeBosk)msgDetail+=`\n• Boskit${needBosk2?' #1':''} [${order.kodeBosk}] -1`;
    if(needBosk2&&order.kodeBosk2)msgDetail+=`\n• Boskit #2 [${order.kodeBosk2}] -1`;

    if(!confirm(`Tandai order ${order.pembeli} sebagai DIKIRIM?\nResi: ${order.nomorResi}\nKelengkapan: ${kelLabel(kel)}${msgDetail}`))return;

    const newOrders=db.orderLive.map(o=>o.id===order.id?{...o,status:'DIKIRIM',tglDikirim:todayStr(),packingNama:user?.nama||'Packing'}:o);
    // Kurangi stok semua item yang terlibat
    let newStok=db.stok.map(s=>s.kode===order.kodeBarang?{...s,keluar:s.keluar+1,stokAkhir:Math.max(0,s.stokAkhir-1)}:s);
    if(needStir2&&order.kodeStir2)
      newStok=newStok.map(s=>s.kode===order.kodeStir2?{...s,keluar:s.keluar+1,stokAkhir:Math.max(0,s.stokAkhir-1)}:s);
    if(needBosk&&order.kodeBosk)
      newStok=newStok.map(s=>s.kode===order.kodeBosk?{...s,keluar:s.keluar+1,stokAkhir:Math.max(0,s.stokAkhir-1)}:s);
    if(needBosk2&&order.kodeBosk2)
      newStok=newStok.map(s=>s.kode===order.kodeBosk2?{...s,keluar:s.keluar+1,stokAkhir:Math.max(0,s.stokAkhir-1)}:s);

    const entry={id:uid(),tanggal:todayStr(),platform:order.platform,kodeBarang:order.kodeBarang,
      kodeBosk:order.kodeBosk||'',kodeStir2:order.kodeStir2||'',kodeBosk2:order.kodeBosk2||'',
      nomorResi:order.nomorResi||'-',namaBarang:order.namaBarang,
      kelengkapan:order.kelengkapan,pembeli:order.pembeli,hostNama:order.hostNama,
      packingNama:user?.nama||'Packing'};
    update('orderLive',newOrders);update('stok',newStok);update('packKeluar',[...db.packKeluar,entry]);
    // Sync status DIKIRIM ke db.penjualan jika order ini terhubung (order dari admin)
    if(order.penjualanId){

      <TblWrap><table>

/* PACKING: TABEL KELUAR */
const PackKeluar=({db})=>{
  const[search,setSearch]=useState('');const[dfrom,setDfrom]=useState('');const[dto,setDto]=useState('');
  const[fPacking,setFPacking]=useState('');const[fJenis,setFJenis]=useState('');
  const stokMap=Object.fromEntries(db.stok.map(s=>[s.kode,s]));
  const packingList=[...new Set(db.packKeluar.map(d=>d.packingNama).filter(Boolean))].sort();
  const jenisList=[...new Set(db.stok.map(s=>s.jenis).filter(Boolean))].sort();
  const filtered=db.packKeluar.filter(d=>{
    const matchSearch=!search||d.namaBarang?.toLowerCase().includes(search.toLowerCase())||d.kodeBarang?.toLowerCase().includes(search.toLowerCase())||d.nomorResi?.toLowerCase().includes(search.toLowerCase());
    const matchPacking=!fPacking||d.packingNama===fPacking;
    const matchJenis=!fJenis||(stokMap[d.kodeBarang]?.jenis===fJenis);
    return matchSearch&&matchPacking&&matchJenis&&inDateRange(d.tanggal,dfrom,dto);
  });
  const {slice,pg,total,setPg}=usePaginate(filtered);
  React.useEffect(()=>setPg(1),[search,dfrom,dto,fPacking,fJenis]);

  const doExport=()=>{
    const headers=['No','Tgl Kirim','Platform','Kode','Nomor Resi','Nama Barang','Kelengkapan','Pembeli','Host','Packing'];
    const rows=filtered.map((d,i)=>[i+1,fmtDate(d.tanggal),d.platform,d.kodeBarang,d.nomorResi,d.namaBarang,kelLabel(d.kelengkapan),d.pembeli,d.hostNama,d.packingNama||'-']);
    exportXlsx(rows,headers,'Tabel_Keluar_Packing');
  };
  const doPdf=()=>{
    const headers=['No','Tgl Kirim','Kode','Nama Barang','Nomor Resi','Pembeli','Host','Status Packing'];
    const rows=filtered.map((d,i)=>[i+1,fmtDate(d.tanggal),d.kodeBarang,d.namaBarang,d.nomorResi||'-',d.pembeli,d.hostNama,d.packingNama||'-']);
    const summary=[{label:'Total Dikirim',value:filtered.length}];
    exportPdf(rows,headers,'TABEL KELUAR PACKING','Tabel_Keluar_Packing',summary);
  };

  return(
    <div>
      <PageHeader title="Tabel Keluar" sub={`${db.packKeluar.length} item terkirim`}
        action={<><BtnExport onClick={doExport}/><BtnExportPdf onClick={doPdf}/></>}/>
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{flex:1,minWidth:160}}><SearchBar value={search} onChange={setSearch} placeholder="Cari nama barang, kode, atau resi..."/></div>
        <div style={{width:160}}>
          <Sel value={fPacking} onChange={setFPacking} placeholder="Semua Packing"
            options={packingList.map(p=>({value:p,label:'📦 '+p}))}/>
        </div>
        <div style={{width:160}}>
          <Sel value={fJenis} onChange={setFJenis} placeholder="Semua Jenis"
            options={jenisList.map(j=>({value:j,label:j}))}/>
        </div>
        <DateRange from={dfrom} to={dto} onFrom={setDfrom} onTo={setDto} onReset={()=>{setDfrom('');setDto('');}}/>
        {(fPacking||fJenis)&&<button onClick={()=>{setFPacking('');setFJenis('');}} style={{background:'none',border:'1px solid #30363D',color:'#8B949E',padding:'5px 8px',borderRadius:5,cursor:'pointer',fontSize:11}}>✕ Reset</button>}
      </div>
      {(fPacking||fJenis)&&<div style={{marginBottom:10,background:'#161B22',border:'1px solid #21262D',borderRadius:7,padding:'8px 14px',fontSize:12,color:'#8B949E',display:'flex',gap:12}}>
        {fPacking&&<span>📦 Packing: <strong style={{color:'#3FB950'}}>{fPacking}</strong></span>}
        {fJenis&&<span>🏷️ Jenis: <strong style={{color:'#58A6FF'}}>{fJenis}</strong></span>}
        <span style={{marginLeft:'auto'}}>Menampilkan <strong style={{color:'#E6EDF3'}}>{filtered.length}</strong> dari {db.packKeluar.length} data</span>
      </div>}
      <TblWrap><table>
        <thead><tr><th>No</th><th>Gambar</th><th>Tgl Kirim</th><th>Platform</th><th>Kode</th><th>Jenis</th><th>Nomor Resi</th><th>Nama Barang</th><th>Kelengkapan</th><th>Pembeli</th><th>Host</th><th>Packing</th></tr></thead>
        <tbody>
          {slice.length===0&&<tr><td colSpan={12} style={{textAlign:'center',color:'#8B949E',padding:28}}>Belum ada barang yang dikirim.</td></tr>}
          {slice.map((d,i)=>{
            const stokItem=stokMap[d.kodeBarang];
            return(
            <tr key={d.id}>
              <td style={{color:'#8B949E'}}>{(pg-1)*PAGE_SIZE+i+1}</td>
              <td>{stokItem?.gambar?<img src={stokItem.gambar} alt={stokItem.nama} style={{width:44,height:44,objectFit:'cover',borderRadius:6,border:'1px solid #30363D'}}/>:<div style={{width:44,height:44,background:'#21262D',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📦</div>}</td>
              <td style={{color:'#3FB950'}}>{fmtDate(d.tanggal)}</td>
              <td style={{color:'#8B949E'}}>{d.platform}</td><td style={{color:'#F97316',fontWeight:600}}>{d.kodeBarang}</td>
              <td>{stokItem?.jenis?<span style={{background:'#0A1B3D',color:'#58A6FF',padding:'2px 7px',borderRadius:20,fontSize:11,fontWeight:600}}>{stokItem.jenis}</span>:<span style={{color:'#8B949E',fontSize:11}}>-</span>}</td>
              <td style={{color:'#58A6FF',fontWeight:500}}>{d.nomorResi}</td><td style={{fontWeight:500}}>{d.namaBarang}</td>
              <td style={{color:'#8B949E'}}>{kelLabel(d.kelengkapan)}</td>
              <td>{d.pembeli}</td>
              <td><span style={{background:'#1A2F50',color:'#58A6FF',padding:'2px 7px',borderRadius:20,fontSize:11}}>{d.hostNama}</span></td>
              <td>{d.packingNama?<span style={{background:'#0D2818',color:'#3FB950',padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:600}}>📦 {d.packingNama}</span>:<span style={{color:'#8B949E',fontSize:11}}>-</span>}</td>
            </tr>
          );})}
        </tbody>
      </table></TblWrap>
      <Pagination pg={pg} total={total} setPg={setPg} count={filtered.length}/>
    </div>
  );
};

/* PACKING: LAPORAN HARIAN */
const LaporanHarianPack=({db,user})=>{
  const[date,setDate]=useState(todayStr());const[fPacking,setFPacking]=useState('');
  const allPack=[...new Set(db.packKeluar.map(d=>d.packingNama))].filter(Boolean);
  const orders=db.orderLive.filter(o=>o.tanggal===date&&(o.status==='PENDING'||o.status==='PROSES'));
  const keluar=db.packKeluar.filter(d=>d.tanggal===date&&(!fPacking||d.packingNama===fPacking));
  const keluarAll=db.packKeluar.filter(d=>d.tanggal===date);
  const packStats=allPack.map(p=>({
    nama:p,jumlah:keluarAll.filter(d=>d.packingNama===p).length,isMe:p===user?.nama
  })).sort((a,b)=>b.jumlah-a.jumlah);
  const {slice:sliceOrders,pg:pgOrders,total:totOrders,setPg:setPgOrders}=usePaginate(orders);
  const {slice:sliceKeluar,pg:pgKeluar,total:totKeluar,setPg:setPgKeluar}=usePaginate(keluar);
  React.useEffect(()=>{setPgOrders(1);setPgKeluar(1);},[date,fPacking]);

  const doExport=()=>{
    try{
      const XLSX=window.XLSX;
      if(!XLSX){alert('Library Excel belum dimuat.');return;}
      const wb=XLSX.utils.book_new();
      // Sheet 1: Antrian Masuk
      const hMasuk=['No','Host','Kode','Nama Barang','Platform','Status','Tgl Order'];
      const rMasuk=orders.map((d,i)=>[i+1,d.hostNama,d.kodeBarang,d.namaBarang,d.platform,d.status||'PENDING',fmtDate(d.tanggal)]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hMasuk,...rMasuk]),'Antrian Masuk');
      // Sheet 2: Keluar
      const hKeluar=['No','Tgl Kirim','Host','Pembeli','Platform','Kode','Nama Barang','Resi','Packing','Kelengkapan'];
      const rKeluar=keluar.map((d,i)=>[i+1,fmtDate(d.tanggal),d.hostNama,d.pembeli,d.platform,d.kodeBarang,d.namaBarang,d.nomorResi,d.packingNama||'-',kelLabel(d.kelengkapan)]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hKeluar,...rKeluar]),'Barang Keluar');
      // Sheet 3: Rekap packing
      const hRekap=['Nama Packing','Total Dikirim'];
      const rRekap=packStats.map(p=>[p.nama,p.jumlah]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hRekap,...rRekap]),'Rekap Per Packing');
      XLSX.writeFile(wb,`Laporan_Harian_Packing_${date}.xlsx`);
    }catch(e){alert('Gagal export: '+e.message);}
  };

  const doPdf=()=>{
    try{
      const {jsPDF}=window.jspdf;
      if(!jsPDF)return alert('Library PDF belum dimuat.');
      const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      const pageW=doc.internal.pageSize.getWidth();
      // Header
      doc.setFillColor(13,17,23);doc.rect(0,0,pageW,26,'F');
      doc.setTextColor(249,115,22);doc.setFontSize(14);doc.setFont('helvetica','bold');
      doc.text('RANCO AUTO',14,12);
      doc.setTextColor(230,237,243);doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.text(`LAPORAN HARIAN PACKING — ${fmtDate(date)}`,14,20);
      doc.setTextColor(139,148,158);doc.setFontSize(8);
      doc.text(`Dicetak: ${new Date().toLocaleString('id-ID')}`,pageW-14,20,{align:'right'});
      // Summary rekap packing
      let y=32;
      if(packStats.length>0){
        doc.setFontSize(8);doc.setTextColor(230,237,243);doc.setFont('helvetica','bold');
        doc.text('REKAP PER USER PACKING:',14,y);y+=5;
        packStats.forEach((p,i)=>{
          const x=14+(i*38);
          doc.setFillColor(22,27,34);doc.roundedRect(x,y,36,12,1,1,'F');
          doc.setTextColor(139,148,158);doc.setFont('helvetica','normal');doc.setFontSize(7);
          doc.text(p.nama,x+2,y+5);
          doc.setTextColor(249,115,22);doc.setFont('helvetica','bold');doc.setFontSize(10);
          doc.text(String(p.jumlah)+' paket',x+2,y+10);
        });
        y+=18;
      }
      // Tabel Antrian Masuk
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(249,115,22);
      doc.text(`📥 ANTRIAN MASUK (${orders.length})`,14,y);y+=2;
      doc.autoTable({
        head:[['No','Host','Kode','Nama Barang','Platform','Status']],
        body:orders.map((d,i)=>[i+1,d.hostNama,d.kodeBarang,d.namaBarang,d.platform,d.status||'PENDING']),
        startY:y,styles:{fontSize:7,cellPadding:2,textColor:[230,237,243],lineColor:[33,38,45],lineWidth:0.2},
        headStyles:{fillColor:[22,27,34],textColor:[139,148,158],fontStyle:'bold'},
        alternateRowStyles:{fillColor:[13,17,23]},bodyStyles:{fillColor:[22,27,34]},
        margin:{left:14,right:14},tableWidth:'auto',
      });
      y=doc.lastAutoTable.finalY+8;
      // Tabel Keluar
      if(y>160){doc.addPage();y=20;}
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(74,222,128);
      doc.text(`📤 BARANG KELUAR (${keluar.length})`,14,y);y+=2;
      doc.autoTable({
        head:[['No','Tgl','Host','Pembeli','Platform','Kode','Nama Barang','Resi','Packing']],
        body:keluar.map((d,i)=>[i+1,fmtDate(d.tanggal),d.hostNama,d.pembeli,d.platform,d.kodeBarang,d.namaBarang,d.nomorResi,d.packingNama||'-']),
        startY:y,styles:{fontSize:7,cellPadding:2,textColor:[230,237,243],lineColor:[33,38,45],lineWidth:0.2},
        headStyles:{fillColor:[22,27,34],textColor:[139,148,158],fontStyle:'bold'},
        alternateRowStyles:{fillColor:[13,17,23]},bodyStyles:{fillColor:[22,27,34]},
        margin:{left:14,right:14},tableWidth:'auto',
      });
      // Footer
      const pgCount=doc.internal.getNumberOfPages();
      for(let pg=1;pg<=pgCount;pg++){
        doc.setPage(pg);const ph=doc.internal.pageSize.getHeight();
        doc.setFontSize(7);doc.setTextColor(139,148,158);
        doc.text(`Halaman ${pg} dari ${pgCount}`,pageW/2,ph-5,{align:'center'});
      }
      doc.save(`Laporan_Harian_Packing_${date}.pdf`);
    }catch(e){alert('Gagal export PDF: '+e.message);}
  };

  return(
    <div>
      <PageHeader title="Laporan Harian Packing"
        action={<><BtnExport onClick={doExport}/><BtnExportPdf onClick={doPdf}/></>}/>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14,flexWrap:'wrap'}}>
        <label style={{color:'#8B949E',fontSize:13}}>Tanggal:</label>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)}
          style={{background:'#161B22',border:'1px solid #21262D',color:'#E6EDF3',padding:'8px 12px',borderRadius:7,fontSize:13,outline:'none'}}/>
        <div style={{width:200}}><Sel value={fPacking} onChange={setFPacking} placeholder="Semua Packing User" options={allPack.map(p=>({value:p,label:p}))}/></div>
        {fPacking&&<Btn size="xs" variant="ghost" onClick={()=>setFPacking('')}>Reset</Btn>}
        <span style={{background:'#1A2030',color:'#F97316',padding:'6px 14px',borderRadius:20,fontSize:12,fontWeight:600}}>Antrian: {orders.length}</span>
        <span style={{background:'#0D2818',color:'#3FB950',padding:'6px 14px',borderRadius:20,fontSize:12,fontWeight:600}}>Keluar: {keluarAll.length}</span>
      </div>
      {packStats.length>0&&<div style={{marginBottom:18}}>
        <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#E6EDF3'}}>📊 Rekap per User Packing — {fmtDate(date)}</h3>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {packStats.map(p=>(
            <div key={p.nama} onClick={()=>setFPacking(fPacking===p.nama?'':p.nama)}
              style={{background:fPacking===p.nama?'#0D2818':'#161B22',border:`1px solid ${fPacking===p.nama?'#3FB950':'#21262D'}`,borderRadius:10,padding:'12px 18px',cursor:'pointer',minWidth:120}}>
              <div style={{color:'#8B949E',fontSize:11,marginBottom:4}}>📦 {p.nama}{p.isMe?<span style={{color:'#F97316',fontSize:10}}> (Saya)</span>:null}</div>
              <div style={{fontSize:22,fontWeight:700,color:fPacking===p.nama?'#3FB950':'#E6EDF3'}}>{p.jumlah}</div>
              <div style={{color:'#8B949E',fontSize:11}}>paket dikirim</div>
            </div>
          ))}
        </div>
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div>
          <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#F97316'}}>📥 Antrian Masuk ({orders.length})</h3>
          <TblWrap><table>
            <thead><tr><th>No</th><th>Host</th><th>Kode</th><th>Barang</th><th>Platform</th><th>Status</th></tr></thead>
            <tbody>
              {orders.length===0&&<tr><td colSpan={6} style={{textAlign:'center',color:'#8B949E',padding:18}}>Tidak ada data.</td></tr>}
              {sliceOrders.map((d,i)=><tr key={d.id}><td style={{color:'#8B949E'}}>{(pgOrders-1)*PAGE_SIZE+i+1}</td><td style={{color:'#58A6FF',fontSize:11}}>{d.hostNama}</td><td style={{color:'#F97316'}}>{d.kodeBarang}</td><td style={{fontSize:12}}>{d.namaBarang}</td><td style={{color:'#8B949E',fontSize:11}}>{d.platform}</td><td><Badge text={d.status||'PENDING'}/></td></tr>)}
            </tbody>
          </table></TblWrap>
          <Pagination pg={pgOrders} total={totOrders} setPg={setPgOrders} count={orders.length}/>
        </div>
        <div>
          <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#3FB950'}}>📤 Keluar{fPacking?` — ${fPacking}`:''} ({keluar.length})</h3>
          <TblWrap><table>
            <thead><tr><th>No</th><th>Platform</th><th>Kode</th><th>Resi</th><th>Barang</th><th>Packing</th></tr></thead>
            <tbody>
              {keluar.length===0&&<tr><td colSpan={6} style={{textAlign:'center',color:'#8B949E',padding:18}}>Tidak ada data.</td></tr>}
              {sliceKeluar.map((d,i)=><tr key={d.id}><td style={{color:'#8B949E'}}>{(pgKeluar-1)*PAGE_SIZE+i+1}</td><td style={{color:'#8B949E',fontSize:11}}>{d.platform}</td><td style={{color:'#F97316'}}>{d.kodeBarang}</td><td style={{color:'#58A6FF',fontSize:11}}>{d.nomorResi}</td><td style={{fontSize:12}}>{d.namaBarang}</td><td><span style={{color:'#3FB950',fontSize:11,fontWeight:500}}>{d.packingNama||'-'}</span></td></tr>)}
            </tbody>
          </table></TblWrap>
          <Pagination pg={pgKeluar} total={totKeluar} setPg={setPgKeluar} count={keluar.length}/>
        </div>
      </div>
    </div>
  );
};

/* PACKING: INPUT BARANG MASUK (terhubung ke stok admin) */
const PackInputBarangMasuk=({db,update,user})=>{
  const[form,setForm]=useState({kode:'',jumlah:1,tanggal:todayStr(),keterangan:''});
  const[log,setLog]=useState([]);
  const barang=db.stok.find(s=>s.kode===form.kode);
  const save=()=>{
    if(!form.kode||!form.jumlah)return alert('Pilih barang dan isi jumlah!');
    if(!barang)return alert('Kode barang tidak ditemukan!');
    const j=+form.jumlah;
    const newStok=db.stok.map(s=>s.kode===form.kode?{...s,masuk:s.masuk+j,stokAkhir:s.stokAkhir+j}:s);
    update('stok',newStok);
    const entry={id:uid(),tanggal:form.tanggal,kode:form.kode,nama:barang.nama,jumlah:j,ket:form.keterangan,inputBy:user?.nama||'Packing'};
    setLog(l=>[entry,...l]);
    setForm({kode:'',jumlah:1,tanggal:todayStr(),keterangan:''});
    alert(`✅ Barang masuk berhasil! Stok ${form.kode} +${j} (terhubung ke Kelola Stok Admin)`);
  };
  return(
    <div>
      <PageHeader title="Input Barang Masuk" sub="Tambah stok barang — otomatis terhubung ke Kelola Stok Admin"/>
      <div style={{background:'#0A1B3D',border:'1px solid #1D3A6A',borderRadius:8,padding:'9px 14px',marginBottom:16,fontSize:12,color:'#58A6FF'}}>
        ℹ️ Data barang masuk yang diinput di sini akan <strong>langsung mengubah stok</strong> di Kelola Stok Admin secara real-time.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <Card>
          <h3 style={{fontSize:14,fontWeight:600,marginBottom:16}}>📦 Form Input Barang Masuk</h3>
          <FRow label="Tanggal"><Inp value={form.tanggal} onChange={v=>setForm({...form,tanggal:v})} type="date"/></FRow>
          <FRow label="Kode Barang">
            <Sel value={form.kode} onChange={v=>setForm({...form,kode:v})} placeholder="-- Pilih Barang --" options={db.stok.map(s=>({value:s.kode,label:`${s.kode} — ${s.nama}`}))}/>
          </FRow>
          {barang&&<div style={{background:'#0D1117',borderRadius:7,padding:'12px 14px',marginBottom:14,display:'flex',gap:14,alignItems:'center'}}>
            {barang.gambar?<img src={barang.gambar} style={{width:54,height:54,objectFit:'cover',borderRadius:8,border:'1px solid #30363D'}} alt=""/>
              :<div style={{width:54,height:54,background:'#21262D',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}}>📦</div>}
            <div>
              <p style={{fontSize:13,color:'#E6EDF3',fontWeight:600}}>{barang.nama}</p>
              <p style={{color:'#8B949E',fontSize:12,marginTop:3}}>Kode: <span style={{color:'#F97316'}}>{barang.kode}</span> · Jenis: <span style={{color:'#58A6FF'}}>{barang.jenis}</span></p>
              <p style={{color:'#8B949E',fontSize:12,marginTop:2}}>Stok saat ini: <span style={{color:'#E3B341',fontWeight:700}}>{barang.stokAkhir}</span> unit · Modal: <span style={{color:'#E6EDF3'}}>{fmtRp(barang.hargaBeli)}</span></p>
            </div>
          </div>}
          <FRow label="Jumlah Barang Masuk"><Inp value={form.jumlah} onChange={v=>setForm({...form,jumlah:v})} type="number" min="1"/></FRow>
          <FRow label="Keterangan (opsional)"><Inp value={form.keterangan} onChange={v=>setForm({...form,keterangan:v})} placeholder="Mis: dari supplier A, kiriman..."/></FRow>
          <Btn full onClick={save}>✅ Simpan Barang Masuk</Btn>
        </Card>
        <div>
          <h3 style={{fontSize:13,fontWeight:600,marginBottom:12,color:'#3FB950'}}>📋 Riwayat Input Sesi Ini</h3>
          {log.length===0?<Card><p style={{color:'#8B949E',fontSize:13,textAlign:'center',padding:20}}>Belum ada input di sesi ini.</p></Card>
          :<Card style={{padding:0}}>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%'}}>
                <thead><tr><th>Tgl</th><th>Kode</th><th>Nama</th><th>+Qty</th><th>Ket</th></tr></thead>
                <tbody>
                  {log.map(l=>(
                    <tr key={l.id}>
                      <td style={{color:'#8B949E',fontSize:12}}>{fmtDate(l.tanggal)}</td>
                      <td style={{color:'#F97316',fontWeight:600}}>{l.kode}</td>
                      <td style={{fontSize:12}}>{l.nama}</td>
                      <td style={{color:'#3FB950',fontWeight:700}}>+{l.jumlah}</td>
                      <td style={{color:'#8B949E',fontSize:12}}>{l.ket||'-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>}
        </div>
      </div>
    </div>
  );
};

/* PACKING: LIHAT STOK (baca dari Kelola Stok Admin) */
const PackLihatStok=({db})=>{
  const[search,setSearch]=useState('');const[filterJenis,setFilterJenis]=useState('');
  const jenisList=[...new Set(db.stok.map(s=>s.jenis))];
  const filtered=db.stok.filter(s=>{
    const m=!search||s.nama.toLowerCase().includes(search.toLowerCase())||s.kode.toLowerCase().includes(search.toLowerCase());
    const j=!filterJenis||s.jenis===filterJenis;
    return m&&j;
  });
  const{slice,pg,total,setPg}=usePaginate(filtered);
  React.useEffect(()=>setPg(1),[search,filterJenis]);
  const totalNilaiModal=filtered.reduce((a,s)=>a+(s.stokAkhir*s.hargaBeli),0);
  const menipis=filtered.filter(s=>s.stokAkhir>0&&s.stokAkhir<=5).length;
  const habis=filtered.filter(s=>s.stokAkhir===0).length;
  return(
    <div>
      <PageHeader title="Lihat Stok Barang" sub="Data stok real-time dari Kelola Stok Admin"/>
      <div style={{background:'#0A1B3D',border:'1px solid #1D3A6A',borderRadius:8,padding:'9px 14px',marginBottom:16,fontSize:12,color:'#58A6FF'}}>
        ℹ️ Data stok ini <strong>langsung dari sistem admin</strong> dan selalu ter-update secara real-time.
      </div>
      <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <StatCard icon="📦" label="Total Item" value={filtered.length} color="#58A6FF"/>
        <StatCard icon="⚠️" label="Stok Menipis (≤5)" value={menipis} color={menipis>0?'#E3B341':'#8B949E'}/>
        <StatCard icon="🚫" label="Stok Habis" value={habis} color={habis>0?'#F85149':'#8B949E'}/>
        <StatCard icon="💰" label="Nilai Modal" value={fmtRp(totalNilaiModal)} color="#3FB950"/>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{flex:1}}><SearchBar value={search} onChange={setSearch} placeholder="Cari kode atau nama barang..."/></div>
        <div style={{width:200}}><Sel value={filterJenis} onChange={setFilterJenis} placeholder="Semua Jenis" options={jenisList.map(j=>({value:j,label:j}))}/></div>
        {filterJenis&&<Btn size="xs" variant="ghost" onClick={()=>setFilterJenis('')}>Reset</Btn>}
      </div>
      <TblWrap><table>
        <thead><tr><th>No</th><th>Gambar</th><th>Kode</th><th>Nama Barang</th><th>Jenis</th><th>Warna</th><th>Stok Awal</th><th>Masuk</th><th>Keluar</th><th>Stok Akhir</th><th>Harga Beli</th><th>Harga Jual</th><th>Harga Reseller</th><th>Status</th></tr></thead>
        <tbody>
          {filtered.length===0&&<tr><td colSpan={14} style={{textAlign:'center',color:'#8B949E',padding:28}}>Tidak ada barang.</td></tr>}
          {slice.map((s,i)=>(
            <tr key={s.id}>
              <td style={{color:'#8B949E'}}>{(pg-1)*PAGE_SIZE+i+1}</td>
              <td>
                {s.gambar?<img src={s.gambar} alt={s.nama} style={{width:44,height:44,objectFit:'cover',borderRadius:6,border:'1px solid #30363D'}}/>
                  :<div style={{width:44,height:44,background:'#21262D',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📦</div>}
              </td>
              <td style={{fontWeight:700,color:'#F97316'}}>{s.kode}</td>
              <td style={{fontWeight:500}}>{s.nama}</td>
              <td style={{color:'#8B949E'}}>{s.jenis}</td>
              <td style={{color:'#8B949E'}}>{s.warna||'-'}</td>
              <td style={{color:'#8B949E'}}>{s.stok}</td>
              <td style={{color:'#3FB950',fontWeight:600}}>{s.masuk}</td>
              <td style={{color:'#F85149',fontWeight:600}}>{s.keluar}</td>
              <td style={{fontWeight:700,fontSize:15,color:s.stokAkhir===0?'#F85149':s.stokAkhir<=3?'#F85149':s.stokAkhir<=5?'#E3B341':'#3FB950'}}>{s.stokAkhir}</td>
              <td style={{color:'#8B949E'}}>{fmtRp(s.hargaBeli)}</td>
              <td style={{fontWeight:500}}>{fmtRp(s.hargaJual)}</td>
              <td style={{color:'#A78BFA',fontWeight:600}}>{fmtRp(s.hargaReseller||0)}</td>
              <td>
                {s.stokAkhir===0?<Badge text="REFUND"/>:s.stokAkhir<=5?<Badge text="PENDING"/>:<Badge text="AKTIF"/>}
              </td>
            </tr>
          ))}
        </tbody>
      </table></TblWrap>
      <Pagination pg={pg} total={total} setPg={setPg} count={filtered.length}/>
    </div>
  );
};

/* ══════════════════════════════
   ROUTER + MAIN APP
══════════════════════════════ */
const AdminPages=({page,db,update,user})=>{
  const p={db,update,user};
  if(page==='pengguna')return<KelolaPengguna {...p}/>;
  if(page==='stok')return<KelolaStok {...p}/>;
  if(page==='laporan-stok')return<LaporanStok {...p}/>;
  if(page==='barang-masuk')return<InputBarangMasuk {...p}/>;
  if(page==='penjualan')return<KelolaPenjualan {...p}/>;
  if(page==='hostlive-tabel')return<KelolaHostLive {...p}/>;
  if(page==='admin-pack-masuk')return<AdminPackMasuk {...p}/>;
  if(page==='kelola-refund')return<KelolaRefund {...p}/>;
  if(page==='laporan-refund')return<LaporanRefund {...p}/>;
  if(page==='potongan')return<KelolaPotongan {...p}/>;
  if(page==='laporan')return<LaporanPenjualan {...p}/>;
  return<AdminDashboard {...p}/>;
};
const HostPages=({page,db,update,user})=>{
  const p={db,update,user};
  if(page==='order-live')return<InputOrderLive {...p}/>;
  if(page==='lihat-stok')return<LihatStokHost db={db}/>;
  if(page==='refund')return<TabelRefund {...p}/>;
  return<HostDashboard {...p}/>;
};
const PackPages=({page,db,update,user})=>{
  if(page==='pack-masuk')return<PackMasuk db={db} update={update} user={user}/>;
  if(page==='pack-keluar')return<PackKeluar db={db}/>;
  if(page==='pack-laporan')return<LaporanHarianPack db={db} user={user}/>;
  if(page==='pack-barang-masuk')return<PackInputBarangMasuk db={db} update={update} user={user}/>;
  if(page==='pack-lihat-stok')return<PackLihatStok db={db}/>;
  return<PackDashboard db={db}/>;
};

const SplashError=({msg})=>(
  <div style={{minHeight:'100vh',background:'#0D1117',display:'flex',alignItems:'center',justifyContent:'center',padding:24,fontFamily:'Sora,sans-serif'}}>
    <div style={{background:'#2D0C0C',border:'1px solid #F85149',borderRadius:12,padding:28,maxWidth:520,width:'100%',color:'#F85149',textAlign:'center'}}>
      <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
      <h2 style={{fontSize:15,fontWeight:700,marginBottom:10}}>Gagal Terhubung ke Database</h2>
      <p style={{fontSize:13,color:'#FCA5A5',lineHeight:1.7,marginBottom:14}}>{msg}</p>
      <p style={{fontSize:12,color:'#8B949E',marginBottom:16}}>Pastikan XAMPP aktif, database <strong style={{color:'#E6EDF3'}}>ranco_auto</strong> sudah dibuat, dan file sudah di folder <strong style={{color:'#E6EDF3'}}>htdocs</strong>.</p>
      <button onClick={()=>location.reload()} style={{background:'#F97316',border:'none',color:'#fff',padding:'10px 28px',borderRadius:8,fontSize:14,cursor:'pointer',fontFamily:'inherit',fontWeight:600}}>🔄 Coba Lagi</button>
    </div>
  </div>
);

const App=()=>{
  const[db,setDb]=useState(null);
  const[ready,setReady]=useState(false);
  const[dbErr,setDbErr]=useState('');
  const[user,setUser]=useState(null);
  const[page,setPage]=useState('dashboard');

  // Muat data dari MySQL via api.php
  React.useEffect(()=>{
    loadDB().then(data=>{
      if(data&&Object.keys(data).length>0){
        // Merge dengan INIT agar semua key selalu ada
        setDb({...INIT,...data});
      }else if(data===null){
        // API error — tetap jalan dengan INIT (offline mode)
        setDbErr('Tidak dapat terhubung ke api.php. Pastikan XAMPP aktif dan file ada di folder htdocs.');
        setDb(INIT);
      }else{
        // DB kosong — pakai INIT
        setDb(INIT);
      }
      setReady(true);
      hideLoader();
    });
  },[]);

  const update=useCallback((key,val)=>{
    setDb(prev=>{
      const n={...prev,[key]:val};
      saveDB(key,val); // simpan ke MySQL
      return n;
    });
  },[]);

  const onLogin=(un,pw)=>{
    const f=db.users.find(u=>u.username===un&&u.password===pw&&u.aktif);
    if(f){setUser(f);setPage('dashboard');return true;}
    return false;
  };
  const onLogout=()=>{setUser(null);setPage('dashboard');};

  if(!ready)return null; // loading bar masih tampil
  if(dbErr&&!user)return<SplashError msg={dbErr}/>;
  if(!user)return<Login onLogin={onLogin}/>;
  return(
    <Layout user={user} page={page} setPage={setPage} onLogout={onLogout}>
      {user.role==='admin'&&<AdminPages page={page} db={db} update={update} user={user}/>}
      {user.role==='hostlive'&&<HostPages page={page} db={db} update={update} user={user}/>}
      {user.role==='packing'&&<PackPages page={page} db={db} update={update} user={user}/>}
    </Layout>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);
</script>
</body>
